name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: placeiq
          POSTGRES_PASSWORD: placeiq
          POSTGRES_DB: placeiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U placeiq"
          --health-interval 5s
          --health-retries 10
    env:
      FLASK_APP: run.py
      DATABASE_URL: postgresql+psycopg://placeiq:placeiq@localhost:5432/placeiq
      TEST_DATABASE_URL: postgresql+psycopg://placeiq:placeiq@localhost:5432/placeiq
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Migrations apply, seed and roll back cleanly
        run: |
          flask db upgrade
          flask seed
          flask db downgrade base
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
