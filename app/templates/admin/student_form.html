{% extends "base.html" %}
{% block title %}{{ action }} Student — PMS{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ action }} Student</h1>
    <a href="{{ url_for('admin.students') }}" class="btn btn-secondary">← Back</a>
</div>
<div class="card glass-card form-card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group"><label for="name">Full Name *</label>
                <input type="text" id="name" name="name" value="{{ student.name if student else '' }}" required></div>
            <div class="form-group"><label for="roll_no">Roll Number *</label>
                <input type="text" id="roll_no" name="roll_no" value="{{ student.roll_no if student else '' }}" required></div>
        </div>
        {% if not student %}
        <div class="form-row">
            <div class="form-group"><label for="username">Username *</label>
                <input type="text" id="username" name="username" required></div>
            <div class="form-group"><label for="password">Password</label>
                <input type="text" id="password" name="password" value="student123" placeholder="Default: student123"></div>
        </div>
        {% endif %}
        <div class="form-row">
            <div class="form-group"><label for="email">Email *</label>
                <input type="email" id="email" name="email" value="{{ student.email if student else '' }}" required></div>
            <div class="form-group"><label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" value="{{ student.phone if student and student.phone else '' }}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label for="branch">Branch *</label>
                <select id="branch" name="branch" required>
                    {% for b in ['CSE','ECE','ME','CE','EE','CHE'] %}
                    <option value="{{ b }}" {% if student and student.branch == b %}selected{% endif %}>{{ b }}</option>
                    {% endfor %}
                </select></div>
            <div class="form-group"><label for="cgpa">CGPA *</label>
                <input type="number" id="cgpa" name="cgpa" step="0.01" min="0" max="10" value="{{ student.cgpa if student else '' }}" required></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label for="backlogs">Active Backlogs</label>
                <input type="number" id="backlogs" name="backlogs" min="0" value="{{ student.backlogs if student else 0 }}"></div>
            {% if student %}
            <div class="form-group"><label for="placement_status">Placement Status</label>
                <select id="placement_status" name="placement_status">
                    <option value="Unplaced" {% if student.placement_status == 'Unplaced' %}selected{% endif %}>Unplaced</option>
                    <option value="Placed" {% if student.placement_status == 'Placed' %}selected{% endif %}>Placed</option>
                </select></div>
            {% endif %}
        </div>
        <button type="submit" class="btn btn-primary">{{ action }} Student</button>
    </form>
</div>
{% endblock %}
