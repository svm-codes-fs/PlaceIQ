{% extends "base.html" %}
{% block title %}Register — PMS{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card glass-card auth-card-wide">
        <div class="auth-header">
            <span class="auth-logo">🎓</span>
            <h1>Student Registration</h1>
            <p class="auth-subtitle">Create your placement account</p>
        </div>
        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Shivam Raj" required>
                </div>
                <div class="form-group">
                    <label for="roll_no">Roll Number *</label>
                    <input type="text" id="roll_no" name="roll_no" placeholder="e.g. 102103001" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" placeholder="your.email@thapar.edu" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" placeholder="Min 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password *</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="branch">Branch *</label>
                    <select id="branch" name="branch" required>
                        <option value="">Select Branch</option>
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="ME">ME</option>
                        <option value="CE">CE</option>
                        <option value="EE">EE</option>
                        <option value="CHE">CHE</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="9876543210">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="cgpa">CGPA *</label>
                    <input type="number" id="cgpa" name="cgpa" step="0.01" min="0" max="10" placeholder="e.g. 8.50" required>
                </div>
                <div class="form-group">
                    <label for="backlogs">Active Backlogs</label>
                    <input type="number" id="backlogs" name="backlogs" min="0" value="0">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="btn-register">Create Account</button>
        </form>
        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
